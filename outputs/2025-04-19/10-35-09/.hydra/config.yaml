gpu: 0
batch_size: 2
num_runs: 1
save_dir: results/sd/ffhq
name: motion_blur
wandb: false
save_samples: true
save_traj: false
save_traj_raw_data: false
show_eval: false
eval_fn_list:
- psnr
- lpips
- ssim
- fs_loss_l2
task_group: sd
project_name: DAPS
seed: 8
data:
  name: image
  root: dataset/demo-ffhq
  resolution: 256
  start_id: 0
  end_id: 2
model:
  name: sdm
  model_id: stable-diffusion-v1-5/stable-diffusion-v1-5
  inner_resolution: 512
  target_resolution: 256
  guidance_scale: 7.5
  prompt: a natural looking image
  hf_home: checkpoints/.cache/huggingface
task:
  pixel:
    mcmc_sampler_config:
      num_steps: 10
      lr: 5.0e-05
      tau: 0.01
      lr_min_ratio: 0.01
      mc_algo: langevin
      prior_solver: gaussian
      use_face_similarity: false
    operator:
      name: motion_blur
      kernel_size: 61
      intensity: 0.5
      sigma: 0.05
  ldm:
    mcmc_sampler_config:
      num_steps: 49
      lr: 2.4e-05
      tau: 0.01
      lr_min_ratio: 0.041
      momentum: 0.45
      mc_algo: hmc
      prior_solver: gaussian
    operator:
      name: motion_blur
      kernel_size: 61
      intensity: 0.5
      sigma: 0.05
  sd:
    mcmc_sampler_config:
      num_steps: 30
      lr: 2.0e-05
      tau: 0.01
      lr_min_ratio: 1
      momentum: 0.85
      mc_algo: hmc
      prior_solver: gaussian
    operator:
      name: motion_blur
      kernel_size: 61
      intensity: 0.5
      sigma: 0.01
sampler:
  latent: true
  annealing_scheduler_config:
    name: edm
    num_steps: 50
    sigma_max: 10
    sigma_min: 0.1
    timestep: poly-7
  diffusion_scheduler_config:
    name: edm
    num_steps: 2
    sigma_min: 0.001
    timestep: poly-7
