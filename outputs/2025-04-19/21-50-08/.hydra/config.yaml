gpu: 0
batch_size: 2
num_runs: 1
save_dir: results/sd/style
name: style_transfer
wandb: false
save_samples: true
save_traj: false
save_traj_raw_data: false
show_eval: false
eval_fn_list:
- lpips
task_group: sd
project_name: DAPS
seed: 8
data:
  name: image
  root: dataset/demo-ffhq
  resolution: 256
  start_id: 0
  end_id: 2
model:
  name: sdm
  model_id: stable-diffusion-v1-5/stable-diffusion-v1-5
  inner_resolution: 512
  target_resolution: 256
  guidance_scale: 7.5
  prompt: a knight holding his sword
  hf_home: checkpoints/.cache/huggingface
task:
  sd:
    mcmc_sampler_config:
      num_steps: 20
      lr: 1.0e-05
      tau: 0.01
      lr_min_ratio: 1
      momentum: 0.6
      mc_algo: hmc
      prior_solver: gaussian
    operator:
      name: inpainting
      mask_type: box
      mask_len_range:
      - 128
      - 129
      resolution: 256
      sigma: 0.01
sampler:
  latent: true
  annealing_scheduler_config:
    name: edm
    num_steps: 50
    sigma_max: 10
    sigma_min: 0.1
    timestep: poly-7
  diffusion_scheduler_config:
    name: edm
    num_steps: 2
    sigma_min: 0.001
    timestep: poly-7
reward:
  rewards:
  - name: style
    steering:
    - gradient
    data_path: dataset/si_daps/style_images
    scale: 0.25
    freq: 10
  num_particles: 2
